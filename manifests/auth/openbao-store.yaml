apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-mail-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-mail-token
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["auth-mail-reader"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-mail-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-mail-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.data.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: auth-mail
          serviceAccountRef:
            name: auth-mail-reader
            audiences: ["openbao"]
